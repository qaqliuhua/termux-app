name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare libmimo.so for jniLibs
        shell: bash {0}
        run: |
          cp app/src/main/jniLibs/arm64-v8a/libmimo.bin app/src/main/jniLibs/arm64-v8a/libmimo.so

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          echo "Building APKs for package variant: $PACKAGE_VARIANT"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          ./gradlew assembleDebug || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*.apk
