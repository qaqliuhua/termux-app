name: Build Verify (feat branches only)

# 仅用于在 feat/* 分支上验证编译，不发布、不合并。
# 推送到 feat/ 分支即触发，产出 debug APK 供人工安装验证。

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare libmimo.so for jniLibs
        shell: bash {0}
        run: |
          cp app/src/main/jniLibs/arm64-v8a/libmimo.bin app/src/main/jniLibs/arm64-v8a/libmimo.so

      - name: Build APK
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          ./gradlew assembleDebug || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-verify-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*.apk